services:
  nav-item:
    build: .
    image: nav-item:local
    container_name: nav-item
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      # 留空则首次启动自动生成随机密码并打印到容器日志
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # 留空则自动生成并保存到 database/.jwt-secret
      - JWT_SECRET=${JWT_SECRET:-}
      - TRUST_PROXY=1
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./data/database:/app/database
      - ./data/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
